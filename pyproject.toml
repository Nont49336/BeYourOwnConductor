[project]
name = "beyourownconductor"
version = "0.1.0"
description = "Gesture-controlled music conducting application using hand tracking and MIDI playback"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Computer Vision & ML
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.21",
    "tensorflow>=2.15.0,<2.20.0",
    "ml-dtypes>=0.4.0,<0.5.0",
    "ultralytics>=8.3.0",
    "torch>=2.9.0",

    # Audio & MIDI
    "mido>=1.3.3",
    "pyfluidsynth>=1.3.4",
    "python-rtmidi>=1.5.8",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",

    # Configuration & Utilities
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",

    # Development
    "ipykernel>=6.30.1",
]
